name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly, so the dictionary and sentences stay current (JMdict's licence asks for updates)
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Offline data: 100,000 everyday sentences (Tatoeba) and the dictionary (JMdict)
      - run: node scripts/build-phrases.mjs
      - run: node scripts/build-dictionary.mjs
      - name: Assemble the site
        run: |
          mkdir -p site/dict
          cp index.html app.js app.css sw.js manifest.webmanifest *.png icon.svg site/
          cp public/dict/* site/dict/
          ls -la site site/dict
      # Published from the gh-pages branch (GitHub turns Pages on by itself for that branch)
      - name: Publish to gh-pages
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
